name: Package

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  roothide:
    runs-on: macos-14
    env:
      THEOS: ${{ github.workspace }}/theos
      THEOS_PACKAGE_SCHEME: roothide
      FINALPACKAGE: 1
      PREFIX: /Applications/Xcode_15.4.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/bin/
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
      - name: Install build tools
        run: brew install make dpkg ldid
      - name: Install Theos and iOS SDK
        run: |
          git clone --depth 1 --recursive https://github.com/roothide/theos.git "$THEOS"
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/processguardian-sdks
          git -C /tmp/processguardian-sdks sparse-checkout set iPhoneOS16.5.sdk
          mkdir -p "$THEOS/sdks"
          cp -R /tmp/processguardian-sdks/iPhoneOS16.5.sdk "$THEOS/sdks/"
      - name: Build deb
        run: |
          export PATH="/opt/homebrew/opt/make/libexec/gnubin:$THEOS/bin:$PATH"
          SYSROOT="$(xcrun --sdk iphoneos --show-sdk-path)"
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 TARGET=iphone:clang:17.5:15.0 SYSROOT="$SYSROOT"
      - name: Verify deb contents
        run: |
          python3 -c 'import plistlib; assert len(plistlib.load(open("Sources/prefs/Root.plist", "rb"))["items"]) == 15'
          deb="$(find packages -maxdepth 1 -name 'com.moxuan.processguardian_*.deb' -print -quit)"
          test -n "$deb" && test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = com.moxuan.processguardian
          test "$(dpkg-deb -f "$deb" Architecture)" = iphoneos-arm64e
          contents="$(dpkg-deb -c "$deb")"
          printf '%s\n' "$contents"
          for file in ProcessGuardian.dylib ProcessGuardianStay.dylib processguardiand ProcessGuardianPrefs.bundle; do
            grep -q "$file" <<<"$contents"
          done
          grep -q 'ProcessGuardianPrefs.bundle/Info.plist' <<<"$contents"
          grep -q 'ProcessGuardianPrefs.bundle/Root.plist' <<<"$contents"
          grep -q 'ProcessGuardianPrefs.bundle/icon.png' <<<"$contents"
          grep -q 'ProcessGuardianPrefs.bundle/icon@2x.png' <<<"$contents"
          grep -q 'ProcessGuardianPrefs.bundle/icon@3x.png' <<<"$contents"
          grep -q 'Library/LaunchDaemons/com.moxuan.processguardiand.plist' <<<"$contents"
          grep -q 'usr/lib/TweakInject/ProcessGuardian.dylib' <<<"$contents"
          grep -q 'usr/lib/TweakInject/ProcessGuardian.plist' <<<"$contents"
          grep -q 'usr/lib/TweakInject/ProcessGuardianStay.dylib' <<<"$contents"
          grep -q 'usr/lib/TweakInject/ProcessGuardianStay.plist' <<<"$contents"
          ! grep -q 'Library/MobileSubstrate/' <<<"$contents"
          ! grep -q 'var/jb/' <<<"$contents"
          ! grep -Eq 'usr/lib/(libellekit|libsubstrate)|usr/libexec/ellekit|CydiaSubstrate.framework' <<<"$contents"
      - uses: actions/upload-artifact@v4
        with:
          name: processguardian-roothide
          path: packages/*.deb
          if-no-files-found: error
